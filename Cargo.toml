[package]
name = "spiderdesk"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Desktop pet 3D: uma aranha que vive sobre a area de trabalho do Windows"

[lib]
name = "spiderdesk"
path = "src/lib.rs"

[[bin]]
name = "spiderdesk"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "3d_bevy_render",
    "scene",
    "jpeg",
    # painel de spawn (UI)
    "ui_api",
    "ui_bevy_render",
    "bevy_picking",
    "ui_picking",
    "bevy_ui_widgets",
    "default_font",
    "x11",
    "wayland",
] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
